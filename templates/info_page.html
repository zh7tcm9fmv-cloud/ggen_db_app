<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}GGen Database{% endblock %}</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0b1220; color: #e2e8f0; margin: 0; line-height: 1.65; }
  .wrap { max-width: 42rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
  h1 { font-size: 1.65rem; font-weight: 700; margin: 0 0 1rem; color: #f1f5f9; }
  h2 { font-size: 1.1rem; font-weight: 700; margin: 1.75rem 0 0.5rem; color: #cbd5e1; }
  p, li { margin: 0.65rem 0; }
  ul { padding-left: 1.25rem; }
  a { color: #38bdf8; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .back { margin-top: 2.5rem; font-size: 0.95rem; }
  .muted { color: #94a3b8; font-size: 0.875rem; margin-top: 2rem; }
</style>
</head>
<body>
<div class="wrap">
{% block content %}{% endblock %}
<p class="back"><a href="/">← Back to GGen Database</a></p>
</div>
</body>
</html>
