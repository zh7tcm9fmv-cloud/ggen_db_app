<!DOCTYPE html>
<html lang="en" data-ui-lang="EN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Investment Priority - GGen Eternal Database</title>
<link rel="preload" href="{{ url_for('static', filename='font/roboto_medium_numbers.ttf') }}?v={{ app_js_version }}" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:'RobotoMediumNumbers';src:url('{{ url_for('static', filename='font/roboto_medium_numbers.ttf') }}?v={{ app_js_version }}') format('truetype');font-weight:normal;font-style:normal;font-display:swap}
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app_shell_bundle.min.css') }}?v={{ app_js_version }}">
{% include '_defer_brand_fonts.html' %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/sp_investment.css') }}?v={{ app_js_version }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/kofi_supporter_wall.css') }}?v={{ app_js_version }}">
<script>
window.__GGEN_IMAGE_CDN__ = {{ (image_cdn or '')|tojson }};
window.__GGEN_GAME_IMAGES_USE_CDN__ = {{ (game_images_use_cdn if game_images_use_cdn is defined else true)|tojson }};
window.__SPI_PREVIEW__ = {{ (spi_preview if spi_preview is defined else false)|tojson }};
try {
  var _lg = localStorage.getItem('ggen_lang');
  if (_lg) {
    document.documentElement.setAttribute('data-ui-lang', _lg);
    var _htmlLang = (_lg === 'JA' || _lg === 'JP') ? 'ja' : (_lg === 'TW' || _lg === 'HK' ? 'zh' : 'en');
    document.documentElement.setAttribute('lang', _htmlLang);
  }
} catch (e) {}
</script>
</head>
<body class="spi-page">
<div class="bg-pattern" aria-hidden="true"></div>

<header class="app-header spi-app-header">
  <div class="header-inner">
    <a class="header-brand" href="/" aria-label="Back to GGen Eternal Database">
      <div class="brand-logo">
        <img src="{% if image_cdn %}{{ image_cdn }}/images/UI/IMG_Common_Logo_ETERNALBASE.webp{% else %}/static/images/UI/IMG_Common_Logo_ETERNALBASE.webp{% endif %}" alt="GGen Eternal Database" width="42" height="42" onerror="this.parentElement.innerHTML='<div style=\'font-size:25px;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center;width:100%;height:100%\'>GG</div>'">
      </div>
      <div class="brand-copy">
        <div class="brand-title-row">
          <h1 class="brand-text">
            <span class="brand-word brand-word-ggen brand-frame-1">GGen</span>
            <span class="brand-word brand-word-db brand-frame-2">Eternal</span>
            <span class="brand-word brand-word-db brand-frame-3">DB</span>
          </h1>
        </div>
        <div class="brand-sub" data-i18n="brand_sub">Investment Priority</div>
      </div>
    </a>
    <div class="spi-header-actions">
      <div class="spi-lang" role="group" data-i18n-aria="lang_aria" aria-label="Language">
        <button type="button" class="spi-lang-btn" data-lang="EN" title="EN">EN</button>
        <button type="button" class="spi-lang-btn" data-lang="JA" title="JP">JP</button>
        <button type="button" class="spi-lang-btn" data-lang="TW" title="TW">TW</button>
        <button type="button" class="spi-lang-btn" data-lang="HK" title="HK">HK</button>
      </div>
      <a class="spi-header-back" href="/" data-i18n="back_db">← Database</a>
    </div>
  </div>
</header>

<main>
{% include '_sp_investment_panel.html' %}
</main>
<script src="{{ url_for('static', filename='js/sp_investment_i18n.js') }}?v={{ app_js_version }}" defer></script>
<script src="{{ url_for('static', filename='js/sp_investment_i18n_guide.js') }}?v={{ app_js_version }}" defer></script>
<script src="{{ url_for('static', filename='js/sp_investment.js') }}?v={{ app_js_version }}" defer></script>
</body>
</html>
