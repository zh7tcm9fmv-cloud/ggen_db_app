{# Brand/CJK OTFs via FONT_CDN (jsDelivr) — off Railway egress.
   Stagger + pause while detail modal is open so portraits stay snappy. #}
<script>
(function(){
  var v={{ app_js_version|tojson }};
  var fontCdn={{ (font_cdn if font_cdn is defined else '')|tojson }};
  var injectedBrand=false;
  var injectedBodyFor='';
  var paused=false;
  var brandTimer=0;
  var bodyTimer=0;

  function currentLang(){
    var lang=String(document.documentElement.getAttribute('data-ui-lang')||'EN').trim().toUpperCase();
    return lang==='JP'?'JA':lang;
  }
  function fontUrl(cdnRel, localRel){
    if(fontCdn)return String(fontCdn).replace(/\/+$/,'')+'/font/'+cdnRel+(v?'?v='+encodeURIComponent(v):'');
    return '/static/font/'+localRel+(v?'?v='+encodeURIComponent(v):'');
  }
  function detailOpen(){
    try{return !!(document.body&&document.body.classList.contains('detail-modal-open'))}catch(_){return false}
  }
  function face(fam,url,fmt,weight){
    return "@font-face{font-family:'"+fam+"';src:url('"+url+"') format('"+fmt+"');font-weight:"+weight+";font-style:normal;font-display:optional}";
  }
  function appendFaces(id,css){
    var old=document.getElementById(id);
    if(old)old.remove();
    var s=document.createElement('style');
    s.id=id;
    s.textContent=css;
    document.head.appendChild(s);
  }

  /* Phase 1 — brand title only (~3.6MB). Never with ShinGo/Noto in the same tick. */
  function injectBrand(){
    if(paused||detailOpen()){scheduleBrand();return}
    if(injectedBrand)return;
    appendFaces('ggenBrandFontFOTK',face(
      'FOTK Yoon Gothic 780 JP',
      fontUrl('JapaneseTextFont/FOTK-YoonGothic780_JP.otf','FOTK-YoonGothic780_JP.otf'),
      'opentype','500'
    ));
    injectedBrand=true;
  }

  /* Phase 2 — body CJK fallbacks. Skipped while detail is open. */
  function injectBody(){
    if(paused||detailOpen()){scheduleBody();return}
    var lang=currentLang();
    if(injectedBodyFor===lang)return;
    var parts=[];
    parts.push(face(
      'ShinGoPr6DeBold',
      fontUrl('JapaneseTextFont/A-OTF-ShinGoPr6-DeBold.otf','JapaneseTextFont/A-OTF-ShinGoPr6-DeBold.otf'),
      'opentype','normal'
    ));
    if(lang==='TW'||lang==='HK'){
      parts.push(face(
        'UDShinGoStdTCMed',
        fontUrl('JapaneseTextFont/UDShinGoStdTC-Med.otf','UDShinGoStdTC-Med.otf'),
        'opentype','500'
      ));
    }
    if(lang==='JA'||lang==='TW'||lang==='HK'){
      parts.push(face(
        'Noto Sans JP',
        fontUrl('NotoSansJP.ttf','NotoSansJP.ttf'),
        'truetype','100 900'
      ));
    }
    appendFaces('ggenBrandFontBody',parts.join(''));
    injectedBodyFor=lang;
  }

  function clearTimers(){
    if(brandTimer){clearTimeout(brandTimer);brandTimer=0}
    if(bodyTimer){clearTimeout(bodyTimer);bodyTimer=0}
  }
  function scheduleBrand(){
    if(brandTimer)clearTimeout(brandTimer);
    brandTimer=setTimeout(function(){
      brandTimer=0;
      if(window.requestIdleCallback)requestIdleCallback(injectBrand,{timeout:4000});
      else injectBrand();
    }, paused||detailOpen()?2500:6000);
  }
  function scheduleBody(){
    if(bodyTimer)clearTimeout(bodyTimer);
    bodyTimer=setTimeout(function(){
      bodyTimer=0;
      if(window.requestIdleCallback)requestIdleCallback(injectBody,{timeout:8000});
      else injectBody();
    }, paused||detailOpen()?4000:14000);
  }
  function scheduleAll(){
    scheduleBrand();
    scheduleBody();
  }

  function pause(){
    paused=true;
    clearTimers();
  }
  function resume(){
    paused=false;
    if(!injectedBrand)scheduleBrand();
    if(injectedBodyFor!==currentLang())scheduleBody();
  }

  /* Full reinject for lang switch — still staggered, never while detail open. */
  function reinjectForLang(){
    injectedBodyFor='';
    var el=document.getElementById('ggenBrandFontBody');
    if(el)el.remove();
    if(detailOpen()){paused=true;return}
    scheduleBody();
    if(!injectedBrand)scheduleBrand();
  }

  function boot(){
    scheduleAll();
  }
  if(document.readyState==='complete')boot();
  else window.addEventListener('load',boot);

  window.__ggenInjectBrandFonts=reinjectForLang;
  window.__ggenPauseBrandFonts=pause;
  window.__ggenResumeBrandFonts=resume;
})();
</script>
